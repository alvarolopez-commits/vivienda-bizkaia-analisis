<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprint 01 · Comparar las opciones A y B</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg:#f5f5f6; --ink:#1c1c20; --muted:#55555f; --line:#d9d9de; --accion:#24406b; --font: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font); }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 16px; }
    .grupo { display: flex; align-items: center; gap: 8px; }
    .grupo > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .seg { display: inline-flex; padding: 3px; gap: 2px; background: #ececef; border-radius: 10px; }
    .seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--muted); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
    :focus-visible { outline: 3px solid var(--accion); outline-offset: 2px; border-radius: 4px; }
    .enlaces { margin-left: auto; display: flex; gap: 14px; font-size: 13.5px; }
    .enlaces a { color: var(--accion); }
    main { display: flex; gap: 12px; padding: 12px; overflow: auto; align-items: flex-start; justify-content: center; min-height: 0; }
    figure { margin: 0; display: grid; gap: 6px; flex: none; }
    figcaption { font-size: 13px; font-weight: 700; }
    figcaption small { font-weight: 400; color: var(--muted); }
    .marco { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Sprint 01 · Navegación y Situación</h1>
    <div class="grupo"><span id="l-ver">Ver</span>
      <div class="seg" role="group" aria-labelledby="l-ver" id="g-ver">
        <button type="button" data-v="ab" aria-pressed="true">A y B juntas</button>
        <button type="button" data-v="a" aria-pressed="false">Solo A</button>
        <button type="button" data-v="b" aria-pressed="false">Solo B</button>
      </div></div>
    <div class="grupo"><span id="l-tam">Tamaño</span>
      <div class="seg" role="group" aria-labelledby="l-tam" id="g-tam">
        <button type="button" data-w="1440" aria-pressed="true">Escritorio 1440</button>
        <button type="button" data-w="1024" aria-pressed="false">1024</button>
        <button type="button" data-w="768" aria-pressed="false">Tableta 768</button>
        <button type="button" data-w="375" aria-pressed="false">Móvil 375</button>
        <button type="button" data-w="320" aria-pressed="false">320</button>
      </div></div>
    <nav class="enlaces" aria-label="Abrir en pestaña">
      <a href="preview-a/" target="_blank" rel="noopener">Abrir A</a>
      <a href="preview-b/" target="_blank" rel="noopener">Abrir B</a>
      <a href="preview-a/#marcar" target="_blank" rel="noopener">A con lo nuevo marcado</a>
      <a href="preview-b/#marcar" target="_blank" rel="noopener">B con lo nuevo marcado</a>
    </nav>
  </header>
  <main id="main">
    <figure id="f-a"><figcaption>Opción A · evolución conservadora <small>(la web original con navegación nueva)</small></figcaption><div class="marco"><iframe id="ifr-a" title="Opción A" src="preview-a/"></iframe></div></figure>
    <figure id="f-b"><figcaption>Opción B · herramienta primero <small>(prototipo aislado · v2 con el sistema visual de Astara)</small></figcaption><div class="marco"><iframe id="ifr-b" title="Opción B" src="preview-b/"></iframe></div></figure>
  </main>
  <script>
    const st = { v: "ab", w: 1440 };
    const main = document.getElementById("main");
    function fit() {
      const both = st.v === "ab";
      document.getElementById("f-a").hidden = st.v === "b";
      document.getElementById("f-b").hidden = st.v === "a";
      const n = both ? 2 : 1, gap = 12, pad = 24;
      const availW = main.clientWidth - pad - gap * (n - 1);
      const scale = Math.min(1, availW / n / st.w);
      const availH = main.clientHeight - 24 - 30;           // marco menos el pie de foto
      const h = Math.max(300, Math.floor(availH / scale));
      for (const id of ["a", "b"]) {
        const f = document.getElementById("ifr-" + id), box = f.parentElement;
        f.style.width = st.w + "px"; f.style.height = h + "px"; f.style.transform = `scale(${scale})`;
        box.style.width = Math.floor(st.w * scale) + "px"; box.style.height = Math.floor(h * scale) + "px";
      }
    }
    for (const [gid, key] of [["g-ver", "v"], ["g-tam", "w"]]) {
      const g = document.getElementById(gid);
      g.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        g.querySelectorAll("button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
        st[key] = key === "w" ? Number(b.dataset.w) : b.dataset.v;
        fit();
      });
    }
    addEventListener("resize", fit);
    fit();
  </script>
</body>
</html>
