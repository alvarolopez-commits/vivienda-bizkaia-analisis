<div class="atlas" id="atlas" aria-busy="true">
    <!-- Cabecera del explorador: título y subtítulo literales de situacion/mapa-vivo.js; fecha con el patrón de main.js -->
    <div class="atlas-cab">
      <div class="atlas-titulo">
        <h1 id="atlas-t">Cada municipio, con su dato</h1>
        <p class="sub">Elige un problema y toca un municipio.</p>
      </div>
      <div class="problemas vidrio" id="problemas" role="group" aria-label="Problema"></div>
    </div>

    <div class="escenario">
      <section class="lienzo" aria-labelledby="ind-titulo">
        <div class="lienzo-cab">
          <p class="ind-titulo" id="ind-titulo"></p>
        </div>
        <div class="mapa-zona">
          <div class="mapa" id="mapa"><p class="cargando">Cargando los datos de los 113 municipios…</p></div>
          <div class="herramientas vidrio" role="toolbar" aria-label="Vista del mapa" data-propuesta>
            <button type="button" class="herr" id="alejar" aria-label="Alejar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
            <button type="button" class="herr" id="acercar" aria-label="Acercar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
            <button type="button" class="herr herr-texto" id="restablecer">Restablecer</button>
          </div>
        </div>
        <div class="tip" id="tip" hidden></div>
        <div class="leyenda-bloque" id="leyenda"></div>
      </section>

      <aside class="panel vidrio" aria-label="Municipio elegido y lista">
        <div class="ficha" id="ficha"></div>
        <section class="lista" aria-labelledby="lista-t">
          <div class="lista-cab">
            <h2 id="lista-t"><span class="suave">Los 113 municipios,</span> de más a menos</h2>
            <div class="lista-filtros">
              <label class="buscar" for="buscar">
                <span class="solo-lectores">Buscar municipio</span>
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
                <input id="buscar" type="search" placeholder="Buscar municipio" autocomplete="off" spellcheck="false" data-propuesta>
              </label>
              <label class="solo-lectores" for="tipo">Tipo de municipio</label>
              <select id="tipo"></select>
            </div>
          </div>
          <div class="lista-scroll" id="lista-scroll">
            <ol class="filas" id="filas" aria-labelledby="lista-t"></ol>
            <div class="lista-pie">
              <button type="button" class="btn" id="mas" hidden></button>
              <details class="sin-dato" id="sin-dato"><summary></summary><ul></ul></details>
              <p class="nota" id="lista-nota"></p>
            </div>
          </div>
        </section>
      </aside>
    </div>

    <p class="fecha" id="fecha"></p>
  </div>
