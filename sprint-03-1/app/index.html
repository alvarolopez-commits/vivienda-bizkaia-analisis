<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vivienda en Bizkaia · Análisis</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <!-- sistema tipográfico único (typography.css), tokens y materiales del Design System (tokens.css), marco compartido (cabecera, menú, botones)
       y una hoja por vista: solo está activa la de la vista abierta -->
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/marco.css">
  <link rel="stylesheet" href="css/lectura.css">
  <link rel="stylesheet" href="css/situacion.css" id="css-situacion">
  <link rel="stylesheet" href="css/medidas.css" id="css-medidas">
  <link rel="stylesheet" href="css/medidas-diseno.css" id="css-medidas-diseno">
  <link rel="stylesheet" href="css/municipios.css" id="css-municipios">
  <link rel="stylesheet" href="css/acceso.css" id="css-acceso">
  <link rel="stylesheet" href="css/normas.css" id="css-normas">
  <link rel="stylesheet" href="css/metodo.css" id="css-metodo">
  <link rel="stylesheet" href="css/movimiento.css">
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/nav.js"></script>
</head>
<body>
  <a class="salto" href="#vista" id="salto">Saltar al contenido</a>

  <!-- Marco único: las seis pestañas (Situación, Municipios, Acceso, Medidas, Normas y Método) se abren aquí, con el mismo marco, el mismo almacén de datos y el mismo sistema de diseño. -->
  <header class="banda">
    <a class="marca" href="#situacion">Vivienda en Bizkaia</a>
    <nav class="vistas vidrio" aria-label="Pestañas">
      <a href="#situacion" data-vista="situacion">Situación</a>
      <a href="#municipios" data-vista="municipios">Municipios</a>
      <a href="#acceso" data-vista="acceso">Acceso</a>
      <a href="#medidas" data-vista="medidas">Medidas</a>
      <a href="#normas" data-vista="normas">Normas</a>
      <a href="#metodo" data-vista="metodo">Método</a>
    </nav>
    <p class="vista-activa" id="vista-activa">Situación</p>
    <div class="banda-dcha">
      <ul class="otros-productos" aria-label="Otros productos">
        <li class="otro-resumen"><a class="enlace-ext" href="https://vizcaya-vivienda-resumen.vercel.app/" target="_blank" rel="noopener">Resumen <span aria-hidden="true">↗</span></a></li>
        <li><a class="btn vidrio" href="https://vizcaya-vivienda.vercel.app/" target="_blank" rel="noopener">Ver el radar <span aria-hidden="true">↗</span></a></li>
      </ul>
      <button type="button" class="menu-boton" id="menu-abrir" aria-haspopup="dialog" aria-controls="menu" aria-expanded="false">Menú</button>
    </div>
  </header>

  <dialog id="menu" class="menu" aria-label="Pestañas">
    <nav class="menu-lista" aria-label="Vistas">
      <a href="#situacion" data-vista="situacion">Situación</a>
      <a href="#municipios" data-vista="municipios">Municipios</a>
      <a href="#acceso" data-vista="acceso">Acceso</a>
      <a href="#medidas" data-vista="medidas">Medidas</a>
      <a href="#normas" data-vista="normas">Normas</a>
      <a href="#metodo" data-vista="metodo">Método</a>
    </nav>
    <section class="menu-otros" aria-labelledby="menu-otros-t">
      <h2 id="menu-otros-t">Otros productos</h2>
      <ul>
        <li><a class="enlace-ext" href="https://vizcaya-vivienda-resumen.vercel.app/" target="_blank" rel="noopener">Resumen <span aria-hidden="true">↗</span></a></li>
        <li><a class="btn" href="https://vizcaya-vivienda.vercel.app/" target="_blank" rel="noopener">Ver el radar <span aria-hidden="true">↗</span></a></li>
      </ul>
    </section>
    <form method="dialog"><button class="btn cerrar">Cerrar <span aria-hidden="true">×</span></button></form>
  </dialog>

  <!-- La vista activa se monta aquí; solo hay una montada a la vez -->
  <main id="vista" tabindex="-1"></main>

  <div id="velo" aria-hidden="true"></div>  <!-- cubre el contenido durante el cambio de vista (css/movimiento.css) -->
  <div class="solo-lectores" role="status" aria-live="polite" data-anuncio></div>
</body>
</html>
